<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332" />
      <stop offset="100%" stop-color="#081C15" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9C46A" />
      <stop offset="100%" stop-color="#D4A373" />
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5" />
  
  <!-- Magnifying Lens Circle -->
  <circle cx="45" cy="45" r="22" fill="#2D6A4F" stroke="#FEF9F0" stroke-width="3" />
  
  <!-- Lens Handle -->
  <line x1="60" y1="60" x2="78" y2="78" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" />
  
  <!-- Brand T Icon in Center -->
  <path d="M 37 36 L 53 36 M 45 36 L 45 54" stroke="#FEF9F0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Accuracy Sparkle Dot -->
  <circle cx="57" cy="33" r="2.5" fill="url(#gold)" />
</svg>
