<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1A1F"/><stop offset="1" stop-color="#3A1514"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <g transform="translate(80 86)">
    <rect width="128" height="128" rx="28" fill="#C8201E"/>
    <circle cx="56" cy="56" r="26" fill="none" stroke="#fff" stroke-width="12"/>
    <path d="M76 76l24 24" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
  </g>
  <text x="250" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff" letter-spacing="-1">PackSure</text>
  <text x="252" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#E9DDD8">Point a phone at a pack. Get a rule-by-rule Legal Metrology verdict,</text>
  <text x="252" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#E9DDD8">letter height measured in millimetres, and a report ready to file.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">
    <rect x="980" y="40" width="180" height="32" rx="16" fill="#C8201E"/>
    <text x="1070" y="61" text-anchor="middle" fill="#fff">LMPC RULES, 2011</text>
  </g>
</svg>
